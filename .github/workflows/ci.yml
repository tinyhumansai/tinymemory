name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Lint levels live in `[lints]` in each crate's Cargo.toml so local and CI
  # runs agree; don't add a blanket RUSTFLAGS here.
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # This job executes repository code (cargo build/test); don't persist
          # the token in git config.
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --all-targets --all-features

      - name: Test
        run: cargo test --all-features

      - name: Test default features
        run: cargo test

      # `cargo build --all-targets` only compiles an example; AGENTS.md
      # promises `cargo run -p tinymemory --example basic` works.
      - name: Run the bundled example
        run: cargo run -p tinymemory --example basic

      # The contract is what engines and hosts compile against. It must stay
      # free of storage engines, native libraries, HTTP clients and async
      # runtimes. The FORWARD form is required: `cargo tree -i <crate> -p ...`
      # discards the `-p` scope and looks clean even when this crate is at
      # fault.
      - name: Assert the contract crate stays free of heavy dependencies
        run: |
          forbidden="$(cargo tree -p tinymemory-api -e normal,build --prefix none \
            | grep -Ei 'rusqlite|libsqlite|git2|reqwest|regex|tokio' || true)"
          if [ -n "$forbidden" ]; then
            echo "tinymemory-api pulled in a dependency it must not have:" >&2
            echo "$forbidden" >&2
            exit 1
          fi

  feature-matrix:
    name: Feature powerset and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - uses: taiki-e/install-action@5bf6ce016fd2e72eefc647cbca1e4213f65955b8 # v2
        with:
          tool: cargo-hack,cargo-llvm-cov

      - name: Feature powerset compiles
        run: cargo hack --feature-powerset --depth 2 --workspace check --all-targets

      - name: Enforce production-source coverage
        run: |
          set -euo pipefail
          cargo llvm-cov --all-features --workspace \
            --ignore-filename-regex '(^|/)tests/|(_tests|_test_support)\.rs$|(^|/)test_support/' \
            --fail-under-lines 80 --summary-only \
            | tee "$GITHUB_STEP_SUMMARY"

      # Unit tests live in sibling `*_tests.rs` files (AGENTS.md). Any
      # `#[cfg(test)]` that guards something other than a `mod` or `use`
      # declaration is test code inline in a production file.
      - name: Refuse inline test code
        run: |
          set -euo pipefail
          inline_test_code="$(
            grep -R -l -E '^[[:space:]]*#\[cfg\((test|any\(test,)' crates \
              --include='*.rs' --exclude='*_tests.rs' --exclude='*_test_support.rs' \
            | xargs -r awk '
              /^[[:space:]]*#\[cfg\((test|any\(test,)/ { cfgline=FNR; pending=1; next }
              pending && (/^[[:space:]]*$/ || /^[[:space:]]*#/ || /^[[:space:]]*\/\//) { next }
              pending {
                if ($0 !~ /^[[:space:]]*(pub\([^)]*\)[[:space:]]+)?(pub[[:space:]]+)?(mod|use)[[:space:]]/)
                  print FILENAME ":" cfgline ":" $0
                pending=0
              }
            '
          )"
          if [[ -n "$inline_test_code" ]]; then
            printf '%s\n' "$inline_test_code" >&2
            echo 'inline test-only executable code must live in a *_tests.rs file' >&2
            exit 1
          fi

  feature-configs:
    name: Test ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: no default features
            features: --no-default-features
          - name: documents
            features: --no-default-features --features documents
          - name: documents-office
            features: --no-default-features --features documents-office
          - name: sources network implication
            features: --no-default-features --features sources-network
          - name: safety
            features: --no-default-features --features safety
          - name: context
            features: --no-default-features --features context
          - name: legacy import
            features: --no-default-features --features legacy-import
          - name: conformance
            features: --no-default-features --features conformance
          - name: full aggregate
            features: --no-default-features --features full
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Test
        run: cargo test -p tinymemory ${{ matrix.features }}

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          set -euo pipefail
          msrv="$(cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[] | select(.name == "tinymemory") | .rust_version')"
          if [[ -z "$msrv" || "$msrv" == "null" ]]; then
            echo "package.rust-version is not set in Cargo.toml" >&2
            exit 1
          fi
          echo "version=$msrv" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Build with the declared MSRV
        env:
          MSRV: ${{ steps.msrv.outputs.version }}
        run: cargo +"$MSRV" build --all-targets --all-features

  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check advisories, licenses, bans, and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check all

  # The HTTP doubles check the wire cheaply; this job proves it against the
  # pinned CortexDB server the `cortexdb` engine targets.
  cortexdb-live:
    name: CortexDB live
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Run the cortexdb engine against a live server
        run: ./scripts/cortexdb-live.sh
