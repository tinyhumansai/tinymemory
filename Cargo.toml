[workspace]
resolver = "2"
# TinyMemory's memory layer is three crates under `crates/`; `tinyredact` is
# the separate local redaction library:
#
# - `tinymemory-api`: the core contract (`MemoryEngine`, items, metadata,
#   namespaces, errors) and, behind `conformance`, the suite every engine must
#   pass.
# - `tinymemory-tools`: the agent-facing tool spec over any engine, holistic
#   recall and the `context.md` compiler, and the agent memory lifecycle.
# - `tinymemory-integrations`: everything that talks to the outside world —
#   the CortexDB engine and its registry, document conversion, source readers,
#   safety scrubbing and the legacy v1 import — each behind a feature.
# - `tinyredact`: standalone secret and personal identifier redaction.
members = ["crates/*"]
# `worktrees/` holds `git worktree` checkouts of this same repository. Each one
# contains a full copy of this manifest and every crate under it, so without
# this entry cargo walks into them and reports duplicate packages.
exclude = ["worktrees"]

# Shared by every crate. The release workflow bumps `version` here, so all
# workspace packages carry the same version and one tag names all of them.
[workspace.package]
version = "2.0.1"
edition = "2024"
rust-version = "1.96"
license = "GPL-3.0-only"
repository = "https://github.com/tinyhumansai/tinymemory"
publish = false

# One lint table for the whole workspace; each crate opts in with
# `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"

[profile.release]
# Cross-crate optimization and smaller, faster binaries for release builds.
lto = "thin"
codegen-units = 1
strip = "debuginfo"
