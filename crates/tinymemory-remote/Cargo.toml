[package]
name = "tinymemory-remote"
publish = false
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
license = "GPL-3.0-only"
description = "HTTP adapters for self-hosted Supermemory, Mem0, and Cognee"
repository = "https://github.com/tinyhumansai/tinymemory"

[dependencies]
# The engine-neutral contract and mandatory-family composition.
tinymemory-api = { path = "../tinymemory-api" }
# Memory is an object-safe async trait and each native HTTP dialect is async.
async-trait = "0.1"
# The storage trait deliberately uses opaque backend errors.
anyhow = "1"
# Native self-hosted APIs are HTTP/JSON; multipart is required by Cognee.
# `stream` is for `bytes_stream()`: response bodies are read against a byte
# cap rather than buffered whole, because the endpoint is operator-supplied
# and a broken or hostile one must not be able to OOM the host.
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
# Only the timer, for the read-retry backoff (issue #18 §U5) — reqwest already
# requires a tokio runtime, so this adds no new runtime assumption.
tokio = { version = "1", default-features = false, features = ["time"] }
# Remote records are translated through a private, lossless envelope.
serde = { version = "1", features = ["derive"] }
# Streaming a capped body needs a Stream combinator.
futures = "0.3"
serde_json = "1"
# Learning timestamps arrive as Unix seconds and CortexDB requires RFC 3339.
chrono = { version = "0.4", default-features = false, features = ["std"] }
# Supermemory custom ids are bounded, so namespace/key identities use SHA-256.
sha2 = "0.11"

[dev-dependencies]
# The behavioural contract suite, run against these adapters over their own
# native doubles (issue #18 §E1, acceptance criterion 5).
tinymemory-conformance = { path = "../tinymemory-conformance" }
# Adapter tests run lightweight native-API doubles over a real TCP transport.
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
missing_errors_doc = "warn"
