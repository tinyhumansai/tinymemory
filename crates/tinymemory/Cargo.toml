[package]
name = "tinymemory"
# Not published: hosts take this repository by git or path.
publish = false
version = "1.22.4"
edition = "2024"
rust-version = "1.96"
license = "GPL-3.0-only"
description = "TinyMemory: recall, fetch and store over pluggable memory engines"
repository = "https://github.com/tinyhumansai/tinymemory"
readme = "../../README.md"
keywords = ["memory", "agent", "llm", "retrieval"]
categories = ["database"]

[dependencies]
# The contract, re-exported wholesale so a host takes one dependency and
# `tinymemory::MemoryEngine` is `tinymemory_api::MemoryEngine`.
tinymemory-api = { path = "../tinymemory-api" }
# The engines the registry builds (`cortexdb`, `tinyhumans`), and the
# `BearerSource` seam `EngineCredential::Dynamic` carries. Not optional: a
# registry with no engine has nothing to build. A host that wants only the
# contract types depends on `tinymemory-api` alone.
tinymemory-cortex = { path = "../tinymemory-cortex" }
# `MemoryConfig` is read out of a host's config file.
serde = { version = "1", features = ["derive"] }
# The optional crates, each behind the feature named after it, re-exported as a
# module of the same name.
tinymemory-documents = { path = "../tinymemory-documents", optional = true }
tinymemory-sources = { path = "../tinymemory-sources", optional = true }
tinymemory-safety = { path = "../tinymemory-safety", optional = true }
tinymemory-context = { path = "../tinymemory-context", optional = true }
tinymemory-import = { path = "../tinymemory-import", optional = true }
tinymemory-conformance = { path = "../tinymemory-conformance", optional = true }

[dev-dependencies]
# `MemoryConfig` round-trips through the TOML and JSON a host stores it in.
toml = "1"
serde_json = "1"
# The registry tests implement `BearerSource`.
async-trait = "0.1"
tokio = { version = "1", features = ["macros", "rt"] }

# One feature per optional crate, all additive and none on by default: naming
# no feature gets the contract, the registry and the CortexDB engines.
[features]
default = []
# Format sniffing and conversion to markdown (`tinymemory::documents`).
documents = ["dep:tinymemory-documents"]
# `OfficeConverter`: PDF, DOCX, PPTX and XLSX to markdown in-process, for a
# host to prepend to its `ConverterChain`. Implies `documents`.
documents-office = ["documents", "tinymemory-documents/office"]
# Source readers that emit `StoreItem`s (`tinymemory::sources`).
sources = ["dep:tinymemory-sources"]
# The network readers in `sources` (GitHub, RSS, web pages, URL fetch).
sources-network = ["sources", "tinymemory-sources/network"]
# Secret and PII scrubbing applied before `store` (`tinymemory::safety`).
safety = ["dep:tinymemory-safety"]
# The `context.md` compiler (`tinymemory::context`).
context = ["dep:tinymemory-context"]
# The legacy v1 workspace reader (`tinymemory::import`).
import = ["dep:tinymemory-import"]
# The spec's name for `import`.
legacy-import = ["import"]
# The behavioural suite and reference engine (`tinymemory::conformance`).
conformance = ["dep:tinymemory-conformance"]
# Everything.
full = ["documents", "documents-office", "sources-network", "safety", "context", "legacy-import", "conformance"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"

[lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"
