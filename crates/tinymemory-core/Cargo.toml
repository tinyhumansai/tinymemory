[package]
name = "tinymemory-core"
# Not published: `tinymemory-core` depends on `tinycortex-api`, which is
# consumed by path and is not on crates.io, so `cargo package` cannot resolve
# the graph. Every consumer takes this repo by path or git.
publish = false
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
license = "GPL-3.0-only"
description = "The engine-neutral memory subsystem: store, summary tree, sync pipelines, ingestion and recall"
repository = "https://github.com/tinyhumansai/tinymemory"
readme = "../../README.md"

[dependencies]
# The contract. `tinymemory-core` implements and consumes it; the host seam
# traits (config, event sink, embeddings, chat) live in `tinymemory_api::host`.
tinymemory-api = { path = "../tinymemory-api" }
# Composio payload normalisers, extracted out of the engine (issue #18 §B3).
# They were reached through `tinycortex` until now, which meant a host binding a
# different engine could not have Composio sync despite none of this code
# caring which engine is bound.
tinymemory-sync = { path = "../tinymemory-sync" }
# The memory-source contracts and readers (#18 §B4). `network` because this
# crate's sync path drives the GitHub/RSS/web-page readers; a host that only
# reads local folders can take the crate without them.
tinymemory-sources = { path = "../tinymemory-sources", features = ["network"] }
# Slack mention tokens (`<@U…>`) in synced messages are rewritten to display
# names before ingestion. Returns to the normal graph for this one user —
# #18 §D2 removed it when nothing used it, which is no argument against a
# real consumer.
regex = "1.10"

# The default embedded engine. `store/`, `tree/` and `sync/` drive it directly;
# `tinycortex-api` is a direct dependency because `tinycortex::memory` aliases
# back only `{error, traits, types}`.
tinycortex = { version = "0.1", features = ["obsidian", "persona", "people", "sync"] }
tinycortex-api = { version = "0.1" }

# Provider-neutral chat-model and embedding primitives used by the tree
# summarizer and embedding factory. Agent runtime and session behavior do not
# belong in the memory layer.
tinyinference-embeddings = "0.2"
tinyinference-llm = "0.2"
anyhow = "1.0"
async-trait = "0.1"
# NO `git2` HERE, DELIBERATELY — do not add it back. `diff/` holds the ops and
# the stubs around the ledger, never a repository handle: tinycortex owns every
# libgit2 call in the stack, and `memory-git` reaches it by forwarding
# `tinycortex/git-diff` + `tinycortex/wiki-git`. A declaration here would be an
# optional dependency with no `use` behind it, and one free to drift off
# tinycortex's major — which `links = "git2"` turns into a hard cargo error
# rather than a warning.
# `store/factories.rs` exposes a tiny health router for the embedded provider.
chrono = { version = "0.4", features = ["serde"] }
# `tinycortex/persona.rs` resolves the user's home directory for the obsidian
# vault default.
dirs = "6"
futures = "0.3"
log = "0.4"
parking_lot = "0.12"
# `tree/tree/registry.rs` salts a tree id; the sync readers talk HTTP to the
# provider APIs; the pipelines are `tracing`-instrumented.
rand = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tracing = "0.1"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"

[dev-dependencies]
# The ported Composio connect tests stand up a mock HTTP server (#18 §B1),
# exactly as they did in the engine.
wiremock = "0.6"
# `TestHostConfig` — the concrete `MemoryHostConfig` the extracted test suites
# build, since `Config` is a trait object and cannot be `Default`ed.
tinymemory-api = { path = "../tinymemory-api", features = ["test-support"] }
# The driver conformance suite (#18 §E1). A dev-dependency only: it exists to
# hold this crate's own store to the same contract the adapters are held to.
# No cycle — `tinymemory-conformance` depends on `tinymemory-api` alone.
tinymemory-conformance = { path = "../tinymemory-conformance" }
# Test-only. `store::factories`' tests stand up a throwaway HTTP server to
# exercise the embedder's failure paths — the four `axum` references in this
# crate are all inside `mod tests`. It was declared as a normal dependency,
# which put a web framework in the normal graph of every build linking this
# crate (#18 §D2).
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query", "ws", "macros"] }
# The facade, for `registry::DriverRegistry` in the admission test — the registry
# is where the trust decision lives and it stays in the facade, so a test that
# exercises admission has to name it. A **dev**-dependency: cargo permits a cycle
# through dev-deps, and this must not become a normal one, which is exactly what
# #18 §D1 removed (a facade that depends on adapters cannot have adapters that
# depend, through core, back on it).
tinymemory = { path = "../tinymemory" }
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }

[features]
default = []
# Git-backed diff snapshots and the wiki git mirror. Gated because it is what
# drags `git2` / `libgit2-sys` / `libz-sys` — a native build — into the graph,
# by way of tinycortex, which is the only crate here that links libgit2.
# The host forwards its own `memory-git` feature to this one; when off, the
# `diff` domain's ops are stubbed rather than `#[cfg]`'d at each call site, so a
# diff simply never materialises.
#
# NOT in `default`, matching the host. The off-path builds because tinycortex
# makes the same carve-out: its `memory::diff::{types, source}` are serde-only
# and stay compiled, so only the git-touching half disappears.
memory-git = ["tinycortex/git-diff", "tinycortex/wiki-git"]
# Exposes the crate's test helpers (`chat::test_override`,
# `chat::StaticChatProvider`, `tool_memory::test_helpers`) to *other* crates'
# tests. They were `#[cfg(test)]` before the extraction, when the host and the
# memory subsystem were one crate and that was enough; a downstream test
# harness cannot see `#[cfg(test)]` items across a crate boundary.
#
# Not in `default`: a production build must not carry them.
test-support = ["tinymemory-api/test-support"]

# The macOS CNContactStore address-book seeding path. No-op off macOS.
#
# Forwarded rather than declared: `people` moved down into the engine, so the
# objc2 cohort is declared there and this crate no longer names those four
# crates at all. `tinycortex/contacts` implies `tinycortex/people`.
contacts = ["tinycortex/contacts"]
