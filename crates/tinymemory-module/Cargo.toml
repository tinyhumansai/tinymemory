# Its own workspace root, deliberately — see the long note on `exclude` in
# `../../Cargo.toml`. In short: this crate depends on the vendored tinybus,
# whose manifest inherits fields from its own nested `[workspace.package]`, and
# being a member of the tinymemory workspace makes cargo resolve that
# inheritance against the wrong root. A separately released artifact wants its
# own lockfile regardless.
[workspace]

[package]
name = "tinymemory-module"
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
license = "GPL-3.0-only"
description = "Trusted TinyBus module adapter for TinyMemory."
repository = "https://github.com/tinyhumansai/tinymemory"
publish = false

[lib]
# `rlib` as well as `cdylib` so the service can be unit-tested in-process
# without going through the loader; the `cdylib` is what a release ships.
crate-type = ["rlib", "cdylib"]

[features]
# Link this module into a host and use Rust-addressable ABI entry points.
# The default keeps the existing loadable cdylib exports.
static-link = []

[dependencies]
# The contract. Every type crossing the bus is one of these, and all of them
# already carry serde impls — which is why this module needs no `wire` module of
# its own, unlike the tinywallet one.
tinymemory-api = { path = "../tinymemory-api" }
# `MemoryTraitProvider`, which pairs a `Memory` backend with a driver id.
tinymemory = { path = "../tinymemory" }
# The engine and the seam that adapts it. Carrying these is the entire point of
# the module: they are 14.7s of the host's critical build path, and a host that
# loads this binary compiles neither.
tinymemory-core = { path = "../tinymemory-core", features = ["memory-git"] }
tinymemory-tinycortex = { path = "../tinymemory-tinycortex", features = ["memory-git"] }
# `contacts` is enabled here rather than inherited: the module serves the
# `MemoryPeople` family directly off the engine's people store, so it needs the
# gate on even though `tinymemory-core` only re-exports the domain.
#
# It replaces `people` rather than joining it. Upstream declares
# `contacts = ["people", ...]`, so naming both would state the same requirement
# twice and invite one of them to be edited without the other.
#
# What the wider gate buys is `SeedFromAddressBook` actually seeding. Without
# `contacts`, `people::address_book`'s macOS implementation compiles out and the
# stub in its place returns an empty contact list — so a refresh reports success
# and imports nobody, which is the failure mode that looks like an empty address
# book rather than a missing feature. That is newly load-bearing: the shipping
# desktop build turns `contacts` on for the in-process engine it also boots, and
# the host's whole people domain is a glob re-export of that engine, so the day
# it is deleted macOS address-book seeding survives only if this module carries
# it. The four objc2 crates behind the gate sit under a macOS target table
# upstream, so a Linux or Windows artifact still compiles none of them.
tinycortex = { version = "0.1", features = ["contacts"] }
# Provider-neutral chat request and response types carried over TinyBus.
tinyinference-llm = "0.3"
# TinyBus provides the typed service interface and the dynamic module host ABI.
# Reached by path now that this crate is its own workspace root: the nested
# checkout's `[workspace.package]` resolves correctly from here.
tinybus = { version = "0.1.0", path = "../../vendor/tinybus/crates/tinybus", default-features = false, features = [
    "macros",
    "modules",
] }
# The module-side SDK owns its runtime and exports the stable C entrypoints.
tinybus-module = { version = "0.1.0", path = "../../vendor/tinybus/crates/tinybus-module" }
# `EmbeddingProvider::embed` is an `async fn` on an object-safe trait.
async-trait = "0.1"
# `EmbeddingProvider::embed` is anyhow-typed.
anyhow = "1"
chrono = "0.4"
# `PersonRef` crosses the contract as an opaque string; the engine keys people
# by `Uuid`, so the People family parses one at the boundary.
uuid = "1"
# Diagnostics. Never carries a namespace key or entry content — see `service`.
log = "0.4"
# Module configuration is JSON supplied by the host at load time.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The interface macro requires every method to be `async fn`, so a runtime has
# to exist. `time` is for the per-hook deadline in `host::run_shutdown_hooks`;
# it compiled without it only because another crate in the graph happened to
# enable the feature, which is not something to depend on.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
# `test-util` gives the paused clock the shutdown-deadline test advances, so it
# asserts the timeout without waiting out a real five seconds.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "test-util"] }
# The host-side contract. A dev-dependency, not a normal one: the module serves
# `tinymemory-api` types directly and needs nothing from this crate to run. What
# it needs is the assertion — that the members it serves are exactly the ones
# `tinymemory-bus` tells a host to expect — and that belongs in tests.
tinymemory-bus = { path = "../tinymemory-bus" }
# The loader E2E and the store tests need a throwaway workspace directory.
tempfile = "3"

# Its own table, because a patch table only applies from the workspace root being
# built and this crate is now its own root — the parent workspace's identical
# entries do not reach here. `tinycortex` and `tinyinference` are unpublished,
# so without these the resolver goes to crates.io and fails.
#
# The paths reach up out of this crate into the parent checkout's `vendor/`,
# which is unusual but correct: these are the same submodules the parent builds
# against, and pointing somewhere else would compile the module against a
# different engine than the workspace it ships from.
# `tinycortex-api` takes the contract by git (issue #18 §A1). This crate is its
# own workspace root, and a patch table only applies from the root being built,
# so the entry has to be repeated here — the parent workspace's identical entry
# does not reach it. Without this, cargo resolves the git copy alongside the
# path copy and `MemoryTaint` from one is not the same type as from the other.
[patch."https://github.com/tinyhumansai/tinymemory"]
tinymemory-api = { path = "../tinymemory-api" }

[patch."https://github.com/tinyhumansai/tinyinference"]
tinyinference-core = { path = "../../vendor/tinyinference/crates/tinyinference-core" }
tinyinference-embeddings = { path = "../../vendor/tinyinference/crates/tinyinference-embeddings" }
tinyinference-llm = { path = "../../vendor/tinyinference/crates/tinyinference-llm" }

[patch.crates-io]
tinycortex = { path = "../../vendor/tinycortex" }
tinycortex-api = { path = "../../vendor/tinycortex/api" }
tinyinference-core = { path = "../../vendor/tinyinference/crates/tinyinference-core" }
tinyinference-embeddings = { path = "../../vendor/tinyinference/crates/tinyinference-embeddings" }
tinyinference-llm = { path = "../../vendor/tinyinference/crates/tinyinference-llm" }

# The linked-host integration test must call TinyBus's unsafe `attach_raw` ABI
# and borrow the generated manifest bytes. Keep unsafe denied everywhere else;
# the test documents its narrow lifetime and pointer invariants at each call.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
doc_markdown = "warn"

[lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"
