[package]
name = "tinymemory-integrations"
description = "TinyMemory integrations: the CortexDB engine, document conversion, source readers, safety scrubbing and the legacy v1 import"
readme = "README.md"
keywords = ["memory", "agent", "llm", "retrieval"]
categories = ["database"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The contract every integration produces or implements: `MemoryEngine`,
# `StoreItem`, `MemoryMeta` and the one `Error` each module's failures map to.
tinymemory-api = { path = "../tinymemory-api" }
# `MemoryEngine`, `BearerSource`, `DocumentConverter` and `SourceReader` are
# object-safe async traits.
async-trait = { version = "0.1", optional = true }
# Every wire body, envelope, cursor and checkpoint is JSON.
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
# The typed errors of `documents`, `sources` and `import`.
thiserror = { version = "2", optional = true }
# Diagnostics: a skipped source item, a dropped Slack message, a scrubbing
# decision, a CortexDB recall pack's warnings and knapsack evictions.
log = { version = "0.4", optional = true }

# --- safety ---
# Local secret and PII scrubbing, the `ScrubbingEngine` and `TimedEngine`
# decorators, and the safe engine-composition path used by the registry.
tinyredact = { path = "../tinyredact", optional = true }

# --- brain ---
# `brain::brain_document` builds the `BrainDocument` the tools crate's
# `Brain` ingests; the brain layout itself lives there.
tinymemory-tools = { path = "../tinymemory-tools", optional = true }

# --- cortex ---
# CortexDB speaks HTTP/JSON. `stream` is for `bytes_stream()`: response bodies
# are read against a byte cap rather than buffered whole, because the endpoint
# is operator-supplied and a broken or hostile one must not exhaust the host.
# The network source readers share the same client stack.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"], optional = true }
# Timers for read-retry backoff and visibility polling (cortex); process
# spawning and DNS lookups for the GitHub reader and the SSRF resolver
# (sources-network). reqwest already requires a tokio runtime, so this adds no
# new runtime assumption.
tokio = { version = "1", default-features = false, features = ["time"], optional = true }
# `StreamExt` to read a capped body chunk by chunk.
futures = { version = "0.3", optional = true }
# Lookup labels are fixed-length SHA-256 digests of metadata values.
sha2 = { version = "0.11", optional = true }

# --- documents-office ---
# Text out of PDFs, Word documents and PowerPoint decks. These readers are
# pure Rust with no system libraries. Spreadsheet import is temporarily
# disabled until a safe Calamine release is published.
pdf-extract = { version = "0.12", optional = true }
quick-xml = { version = "0.42", optional = true }
zip = { version = "9", default-features = false, features = ["deflate"], optional = true }

# --- sources ---
# JSON Schema derives are only needed by hosts that generate schemas.
schemars = { version = "1.2", optional = true }
# URL parsing for source target validation, without enabling a network client.
url = { version = "2", optional = true }
# The folder reader compiles a source's glob to a regex; safety's credential
# and PII patterns are regexes too.
regex = { version = "1.10", optional = true }
# The folder reader walks the directory tree.
walkdir = { version = "2", optional = true }
# Timestamps: `MemoryMeta::observed_at`, file mtimes, feed and issue dates,
# Gmail `Date:` headers.
chrono = { version = "0.4", features = ["clock", "serde"], optional = true }
# Diagnostics on the network readers and the Gmail normaliser.
tracing = { version = "0.1", optional = true }

# --- legacy-import ---
# Read-only access to a v1 workspace's `memory/memory.db` and
# `memory_tree/chunks.db`. Bundled so the importer does not depend on a system
# SQLite; `functions` lets a count apply the importer's own blank-text test in
# SQL.
rusqlite = { version = "0.40", features = ["bundled", "functions"], optional = true }

[dev-dependencies]
# The behavioural suite every engine must pass, run over both CortexDB wires'
# doubles, and the reference engine the import driver is tested against.
tinymemory-api = { path = "../tinymemory-api", features = ["conformance"] }
# `tests/live_cortexdb.rs` compiles `context.md` from a live server, and the
# agent lifecycle runs over the CortexDB doubles.
tinymemory-tools = { path = "../tinymemory-tools" }
# The CortexDB and TinyHumans doubles are real HTTP servers on loopback.
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "net", "io-util", "time"] }
# Reader and import tests build throwaway folders and v1 workspaces.
tempfile = "3"
# The memory_eval example timestamps its scripted turns and writes its report.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The format and office tests build their OOXML fixtures in code.
zip = { version = "9", default-features = false, features = ["deflate"] }
# `MemoryConfig` round-trips through the TOML a host stores it in.
toml = "1.1"

[features]
# The CortexDB engine and the registry that builds it: what most hosts want.
default = ["cortex"]
# `cortex::CortexEngine` over both wires (`cortexdb` direct `/v1/*`, and
# `tinyhumans` behind the TinyHumans backend `/memory/*`), plus `registry`
# (`list_engines`, `build_engine`, guarded `EngineBinder`) and `config`
# (`MemoryConfig`). It implies `safety` so every binder result is scrubbed.
cortex = ["dep:async-trait", "dep:serde", "dep:serde_json", "dep:reqwest", "dep:tokio", "dep:futures", "dep:sha2", "dep:log", "safety"]
# `documents`: format sniffing and conversion to markdown, emitting
# `StoreItem::Document`. Does no I/O.
documents = ["dep:async-trait", "dep:serde", "dep:serde_json", "dep:thiserror"]
# `documents::OfficeConverter`: PDF, DOCX and PPTX to markdown, for a
# host to prepend to its `ConverterChain`. Off by default because a PDF parser
# is real weight. XLSX is recognized but temporarily unsupported.
documents-office = ["documents", "dep:pdf-extract", "dep:quick-xml", "dep:zip"]
# `brain`: converting raw files into `tinymemory_tools::BrainDocument`s
# placed under the source type their format implies.
brain = ["documents", "dep:tinymemory-tools"]
# `sources`: readers, host source types/validation, state types and placement
# support. Target validation uses `url` but links no HTTP client.
sources = ["documents", "dep:tinymemory-tools", "dep:url", "dep:regex", "dep:walkdir", "dep:chrono", "dep:log", "dep:tracing"]
# JSON Schema derives for source reader and host configuration types.
schema = ["sources", "dep:schemars"]
# The readers that fetch over the network — GitHub, RSS, web pages — and
# `sources::fetch::fetch_url`, all behind the shared SSRF guard.
sources-network = ["sources", "dep:reqwest", "dep:futures", "dep:tokio", "tokio/process", "tokio/io-util", "tokio/net"]
# `safety`: item scrubbing plus the `ScrubbingEngine` and `TimedEngine`
# decorators used by every binder result.
safety = ["dep:tinyredact", "dep:log", "dep:async-trait"]
# `import`: reads a legacy v1 (embedded TinyCortex) workspace and migrates it
# into any engine, resumably.
legacy-import = ["dep:rusqlite", "dep:serde", "dep:serde_json", "dep:thiserror", "dep:async-trait", "dep:log"]
# Every integration.
full = ["cortex", "documents-office", "brain", "sources-network", "safety", "legacy-import"]

[[example]]
name = "basic"
required-features = ["cortex"]

[[example]]
name = "memory_eval"
path = "examples/memory_eval/main.rs"
required-features = ["cortex", "brain"]
# Runs the eval's own unit tests (KPI arithmetic, comparison verdicts) under
# `cargo test`; the eval itself only runs through `cargo run`.
test = true

[[example]]
name = "cortex_agent"
required-features = ["cortex", "brain", "documents-office"]

[[test]]
name = "live_cortexdb"
required-features = ["cortex"]

[[test]]
name = "live_cortex_lifecycle"
required-features = ["cortex", "brain"]

[[test]]
name = "office_live"
required-features = ["documents-office", "cortex"]

[[test]]
name = "legacy_import"
required-features = ["legacy-import"]

[[test]]
name = "legacy_importer"
required-features = ["legacy-import"]

[[test]]
name = "reader_dispatch"
required-features = ["sources"]

[[test]]
name = "binder_timing"
required-features = ["cortex"]

[lints]
workspace = true
