[package]
name = "tinymemory-documents"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "GPL-3.0-only"
repository = "https://github.com/tinyhumansai/tinymemory"
description = "Document intake for TinyMemory: sniff a format, convert it to markdown, emit a StoreItem::Document"
publish = false

[dependencies]
# The contract. Intake emits `StoreItem::Document` with the caller's
# `MemoryMeta`, so the item it builds is exactly what an engine stores.
tinymemory-api = { path = "../tinymemory-api" }
# `DocumentConverter` is an object-safe async trait: a host swaps the converter
# (a PDF or DOCX extractor) without this crate knowing which one it got.
async-trait = "0.1"
# `ConvertedDocument::metadata` is an open `Value` a converter fills with
# whatever it learned (page count, author, its own name).
serde_json = "1"
# `DocumentFormat` and `ConvertedDocument` cross host boundaries as JSON.
serde = { version = "1", features = ["derive"] }
# The crate-wide `Error`.
thiserror = "2"
# The office converter (`office` feature): text out of the formats people
# actually drop into memory — a contract PDF, a spec `.docx`, a pricing
# `.xlsx`, a deck. All pure Rust with no system libraries.
#
# `pdf-extract` reads a PDF's text layer. `zip` + `quick-xml` are the whole of
# `.docx` and `.pptx`, which are zip archives of XML: walking them directly is
# smaller than a document library. `.xlsx` is not — shared-string tables and
# cell typing make hand-parsing it a liability — so `calamine` reads that one.
# `zip` and `quick-xml` are the versions `calamine` already links, so the
# graph carries one copy of each.
pdf-extract = { version = "0.12", optional = true }
calamine = { version = "0.36", optional = true }
quick-xml = { version = "0.41", optional = true }
zip = { version = "8", default-features = false, features = ["deflate"], optional = true }

[dev-dependencies]
# The converter and item paths are async.
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
# The format and office tests build their OOXML fixtures in code, so each test
# says what it is asserting about instead of pointing at an opaque binary.
zip = { version = "8", default-features = false, features = ["deflate"] }

[features]
# Nothing by default: text, markdown, HTML and code need no extractor.
default = []
# `OfficeConverter`: PDF, DOCX, PPTX and XLSX to markdown, for a host to
# prepend to its `ConverterChain`. Off by default because a PDF parser and a
# spreadsheet reader are real weight a host that takes only text should not
# link.
office = ["dep:pdf-extract", "dep:calamine", "dep:quick-xml", "dep:zip"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"

[lints.rustdoc]
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"
