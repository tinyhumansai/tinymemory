# A real CortexDB server for the `cortexdb` engine's live tests, with a
# deterministic OpenAI-compatible inference double so it needs no credential.
# See README.md in this directory.
name: tinymemory-cortexdb

services:
  cortex:
    image: ${CORTEXDB_IMAGE:-cortexdb/cortexdb@sha256:636e0ed0b8cd4ae2f307e3a90f99050f7879f73c556b1ccbbabf2d3a383398fc}
    command: ["3141", "/data"]
    environment:
      CORTEX_API_KEY: ${TINYMEMORY_TEST_CORTEX_KEY:-tinymemory-cortex-test}
      CORTEX_DEPLOYMENT_PRESET: dev_local
      CORTEX_EMBEDDING_URL: ${CORTEX_INFERENCE_URL:-http://mock-inference:8080/v1}
      CORTEX_EMBEDDING_API_KEY: ${CORTEX_INFERENCE_KEY:-tinymemory-test}
      # CortexDB's fallback key for any lane without its own. The verifier
      # also turns on whenever it is set, so the no-verifier flag profile
      # empties it along with CORTEX_VERIFIER_API_KEY.
      OPENAI_API_KEY: ${CORTEX_FALLBACK_KEY-${CORTEX_INFERENCE_KEY:-tinymemory-test}}
      CORTEX_EMBEDDING_MODEL: ${CORTEX_EMBEDDING_MODEL:-vectors}
      CORTEX_EMBEDDING_DIMS: "3072"
      CORTEX_LLM_URL: ${CORTEX_INFERENCE_URL:-http://mock-inference:8080/v1}
      CORTEX_ENTITY_API_KEY: ${CORTEX_INFERENCE_KEY:-tinymemory-test}
      CORTEX_LLM_MODEL: ${CORTEX_EXTRACTION_MODEL:-flash}
      CORTEX_ENRICHMENT_URL: ${CORTEX_INFERENCE_URL:-http://mock-inference:8080/v1}
      CORTEX_ENRICHMENT_API_KEY: ${CORTEX_INFERENCE_KEY:-tinymemory-test}
      CORTEX_ENRICHMENT_MODEL: ${CORTEX_ENRICHMENT_MODEL:-reasoning}
      CORTEX_ENRICHMENT_DELAY_SECONDS: "0"
      CORTEX_ANSWER_PROVIDER: openai
      CORTEX_ANSWER_URL: ${CORTEX_INFERENCE_URL:-http://mock-inference:8080/v1}
      CORTEX_ANSWER_API_KEY: ${CORTEX_INFERENCE_KEY:-tinymemory-test}
      CORTEX_ANSWER_MODEL: ${CORTEX_ANSWER_MODEL:-reasoning}
      CORTEX_VERIFIER_URL: ${CORTEX_INFERENCE_URL:-http://mock-inference:8080/v1}
      CORTEX_VERIFIER_API_KEY: ${CORTEX_VERIFIER_API_KEY-${CORTEX_INFERENCE_KEY:-tinymemory-test}}
      CORTEX_VERIFIER_MODEL: ${CORTEX_VERIFIER_MODEL:-max-reasoning}
      CORTEX_VERIFIER_MAX_TOKENS: "16384"
      # Only the rerank-cohere flag profile uses it.
      COHERE_API_KEY: ${COHERE_API_KEY:-}
    # The server's feature flags: the baseline, then the profile under test
    # (scripts/memory-flag-sweep.sh), which only names what it changes. See
    # flags/README.md. A variable in `environment` above wins over both.
    env_file:
      - flags/baseline.env
      - ${CORTEX_FLAGS_FILE:-flags/baseline.env}
    ports: ["127.0.0.1:${CORTEXDB_PORT:-3141}:3141"]
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - cortex-data:/data
      - ./${CORTEX_TOML:-cortex.toml}:/data/cortex.toml:ro
    depends_on:
      mock-inference:
        condition: service_healthy

  mock-inference:
    build:
      context: .
      dockerfile: mock-inference.Dockerfile
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 2s
      timeout: 2s
      retries: 10

volumes:
  cortex-data:
